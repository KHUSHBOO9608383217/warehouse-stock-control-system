# =============================================
# Product Service Configuration
# =============================================
server:
  port: ${PRODUCT_SERVICE_PORT:8081}

spring:
  application:
    name: product-service

  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/warehouse_product_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    # Allow data.sql to run after Hibernate creates/updates schema
    defer-datasource-initialization: true

  # Load sample data on startup
  sql:
    init:
      mode: always

# Swagger / OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Logging Configuration
logging:
  level:
    com.warehouse.product: INFO
    org.springframework: WARN
    org.hibernate.SQL: WARN
